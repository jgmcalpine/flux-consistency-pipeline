# identity = what must NEVER change between shots. Be specific and physical:
# "deep-set grey eyes" survives 10 generations; "kind eyes" drifts on the 2nd.
# Describe what a camera sees, not the story: "living in the jungle" would put jungle in every shot.
# One unusual mark (a scar, a streak of colour) gives you and the QA step an anchor.
id: ismael
name: Ismael Calder
identity:
  who: a man, a jewelry maker
  age: in his early 40s
  build: tall and wiry, slightly stooped shoulders
  face: weathered tan skin, deep-set brown-green eyes, high cheekbones, deep laugh lines, short dark beard flecked with grey, neatly trimmed
  hair: brown hair with streaks of grey worn in dreadlocks tied back with a plain dark green bandana with no pattern
  marks: a thin pale scar through his left eyebrow

# costumes = what CAN change, but only between scenes, never within one.
# The story is one continuous afternoon, so there is one costume.
# Hex codes pin colours exactly (FLUX.2 reads "in color #RRGGBB").
costumes:
  beachwear: >-
    a tank top in color #40474D with a circle of color #DCB54A on the front,
    a pair of shorts in color #9C8084, simple brown rope sandals

# Locked at M3 with `fluxpipe lock`: the face, then one sheet per costume.
reference_images:
- refs/ismael/face.png
costume_references:
  beachwear:
  - refs/ismael/sheet-beachwear.png
