# The shot list. Every shot references the bible by id; prompts are built from it.
# Story: Ismael finds a green crystal in a jungle river, carries it home at dusk,
# sets it into the necklace he has been making, and falls asleep in his hammock as the fire dies.
#
# Walk home: s05 he climbs the path AWAY from camera toward his hut on the ridge (the plate's
# view); s06 he reaches it moving LEFT TO RIGHT. His hut is the only building in the film.
# Fire: burning in s07-s10, burnt out in s11. Each shot says so; the location doesn't.
# Crystal: small (thumb length); shots hold it between thumb and forefinger to pin the scale.
# Face shots for identity QA: s02, s04, s07, s08 (s01, s05, s06, s11 too small to judge).
# s03, s09, s10 are hands only (face: false): QA fails a candidate that shows his face.
# plate: false = don't attach the location plate (it copies its camera position; see CLAUDE.md).
# s10 is the riskiest shot (fingers + small objects). If it fails, cut s09 -> s11.

# Applies to every shot. One look for the whole film = one place to change it.
style: cinematic 35mm film still, anamorphic, natural film grain, muted colour grade

# Every shot starts from these; a shot overrides only what it needs.
camera_defaults:
  angle: eye level
  lens: 35mm
  depth_of_field: shallow, subject sharp, background soft

shots:
  # --- Riverbank, late afternoon ---
  - id: s01
    character: ismael
    costume: beachwear
    location: riverbank
    props: [satchel]
    framing: wide shot, the river filling the frame, the man small at the water's edge
    camera: { lens: 24mm, depth_of_field: "deep, everything in focus" }
    position: crouched at the water's edge, left of centre, the satchel on the bank behind him
    action: he sifts gravel in a shallow metal pan, rinsing it slowly in the river
    mood: patient, absorbed
    duration_s: 5

  - id: s02
    character: ismael
    costume: beachwear
    location: riverbank
    framing: medium shot, waist up
    camera: { lens: 50mm }
    position: centre frame, facing the camera, the pan in his hands
    action: he stops sifting and goes completely still, leaning closer to the pan
    mood: sudden focus
    duration_s: 5

  - id: s03
    character: ismael
    costume: beachwear
    location: riverbank
    props: [crystal]
    framing: close-up of his hands and the metal pan, his face out of frame
    camera: { lens: 85mm }
    position: hands in the centre of the frame, holding the pan of wet gravel
    action: >-
      his wet thumb and forefinger pick the small green crystal out of the gravel in the metal pan,
      water running off it
    mood: discovery
    face: false
    duration_s: 5

  - id: s04
    character: ismael
    costume: beachwear
    location: riverbank
    props: [crystal, satchel]
    framing: medium close-up, head and shoulders
    camera: { lens: 85mm }
    position: centre frame, three-quarter view facing right
    action: >-
      he smiles, slips the small crystal held between his thumb and forefinger into the satchel and
      lifts its strap onto his shoulder
    mood: quiet joy
    duration_s: 5

  # --- Jungle path, golden hour into dusk ---
  - id: s05
    character: ismael
    costume: beachwear
    location: jungle_path
    props: [satchel]
    framing: wide shot, the path leading up to his hut on the ridge, the man small on the path
    camera: { lens: 24mm, depth_of_field: "deep, everything in focus" }
    position: walking up the path away from the camera, lower third of the frame, satchel on his shoulder
    action: he climbs the winding path toward his hut at an easy pace
    mood: content, unhurried
    duration_s: 5

  - id: s06
    character: ismael
    costume: beachwear
    location: jungle_path
    props: [satchel]
    framing: medium wide shot on the top of the ridge, his hut on the right of the frame
    camera: { lens: 35mm }
    position: walking from left to right toward his hut
    action: he reaches his hut as dusk falls, warm firelight glowing inside it through the open sides
    mood: homecoming
    plate: false  # the plate's hut is far away at the top of the path; here we are beside it
    lighting: dusk, the last blue light of the day, warm firelight glowing inside the hut
    duration_s: 5

  # --- Inside the hut, night. The fire burns in s07-s10 and is out in s11. ---
  - id: s07
    character: ismael
    costume: beachwear
    location: thatched_hut
    props: [satchel]
    framing: medium shot, waist up, the burning fire pit in frame
    position: centre frame beside the worktable
    action: >-
      he drops the satchel on the floor and sits down at the worktable, the fire burning brightly
      in the fire pit beside him
    mood: eager
    duration_s: 5

  - id: s08
    character: ismael
    costume: beachwear
    location: thatched_hut
    props: [crystal]
    framing: close-up of his face and the crystal
    camera: { lens: 85mm }
    position: face left of centre, the small crystal held up on the right
    action: >-
      he holds the small crystal up to the firelight between his thumb and forefinger and turns it
      slowly, smiling, the fire burning behind him
    mood: delight
    duration_s: 5

  - id: s09
    character: ismael
    costume: beachwear
    location: thatched_hut
    props: [necklace]
    framing: close-up of the top of the worktable, only his hands and forearms in frame, his face out of frame
    camera: { angle: slightly above, lens: 50mm }
    position: the necklace in the centre of the table
    action: he lifts a cloth to reveal the necklace lying on the table, its copper cage empty
    mood: anticipation
    plate: false  # a close-up; the plate would pull it back to the wide view of the hut
    scene: the dark wooden top of the small worktable in his hut, copper wire, beads and small hand tools on it
    lighting: warm amber firelight from the fire burning just out of frame
    face: false
    duration_s: 5

  - id: s10
    character: ismael
    costume: beachwear
    location: thatched_hut
    props: [crystal, necklace]
    framing: extreme close-up of his hands, the necklace and the crystal, his face out of frame
    camera: { angle: slightly above, lens: 100mm macro }
    position: hands in the centre of the frame, above the worktable
    action: >-
      his fingers slide the small crystal into the empty copper cage, which is exactly its length,
      and press the prongs closed around it
    mood: careful, precise
    plate: false
    scene: the dark wooden top of the small worktable in his hut, copper wire, beads and small hand tools on it
    lighting: warm amber firelight from the fire burning just out of frame
    face: false
    duration_s: 5

  - id: s11
    character: ismael
    costume: beachwear
    location: thatched_hut
    # The crystal is NOT its own subject here: a separate subject gets drawn as a separate object
    # (round 2 stood it loose on the table). It is part of the finished necklace, so the action says so.
    props: [necklace]
    framing: medium wide shot, the hammock and the worktable both in frame
    position: lying stretched out in the hammock on the left, the worktable on the right
    action: >-
      he lies asleep in the hammock, eyes closed; the finished necklace lies flat on the worktable,
      the small green crystal now held inside its copper cage; the fire pit has burnt out
    mood: peaceful, complete
    lighting: >-
      cold blue moonlight only; the fire pit is dark, burnt out to grey ash with a thin wisp of smoke
    duration_s: 5
