# The shot list. Every shot references the bible by id; prompts are built from it.
# Story: Ismael finds a green crystal in a jungle river, carries it home at dusk,
# sets it into the necklace he has been making, and rests.
#
# Screen direction: on the walk home he always moves LEFT TO RIGHT (s05, s06).
# Face shots for identity QA: s02, s04, s07, s08, s11 (s01, s06 partly).
# s10 is the riskiest shot (fingers + small objects). If it fails, cut s09 -> s11.

# Applies to every shot. One look for the whole film = one place to change it.
style: cinematic 35mm film still, anamorphic, natural film grain, muted colour grade

# Every shot starts from these; a shot overrides only what it needs.
camera_defaults:
  angle: eye level
  lens: 35mm
  depth_of_field: shallow, subject sharp, background soft

shots:
  # --- Riverbank, late afternoon ---
  - id: s01
    character: ismael
    costume: beachwear
    location: riverbank
    props: [satchel]
    framing: wide shot, the river filling the frame, the man small at the water's edge
    camera: { lens: 24mm, depth_of_field: "deep, everything in focus" }
    position: crouched at the water's edge, left of centre, the satchel on the bank behind him
    action: he sifts gravel in a shallow metal pan, rinsing it slowly in the river
    mood: patient, absorbed
    duration_s: 5

  - id: s02
    character: ismael
    costume: beachwear
    location: riverbank
    framing: medium shot, waist up
    camera: { lens: 50mm }
    position: centre frame, facing the camera, the pan in his hands
    action: he stops sifting and goes completely still, leaning closer to the pan
    mood: sudden focus
    duration_s: 5

  - id: s03
    character: ismael
    costume: beachwear
    location: riverbank
    props: [crystal]
    framing: close-up of his hands and the pan, his face out of frame
    camera: { lens: 85mm }
    position: hands in the centre of the frame
    action: wet fingers lift the green crystal out of the gravel, water running off it
    mood: discovery
    duration_s: 5

  - id: s04
    character: ismael
    costume: beachwear
    location: riverbank
    props: [crystal, satchel]
    framing: medium close-up, head and shoulders
    camera: { lens: 85mm }
    position: centre frame, three-quarter view facing right
    action: he smiles, slips the crystal into the satchel and lifts its strap onto his shoulder
    mood: quiet joy
    duration_s: 5

  # --- Jungle path, golden hour into dusk ---
  - id: s05
    character: ismael
    costume: beachwear
    location: jungle_path
    props: [satchel]
    framing: wide shot, the man small on the path, jungle all around
    camera: { lens: 24mm, depth_of_field: "deep, everything in focus" }
    position: walking from left to right, lower third of the frame, satchel on his shoulder
    action: he climbs the winding path at an easy pace
    mood: content, unhurried
    duration_s: 5

  - id: s06
    character: ismael
    costume: beachwear
    location: jungle_path
    props: [satchel]
    framing: wide shot, the hut on the right of the frame
    camera: { lens: 35mm }
    position: walking from left to right toward the hut's doorway
    action: he reaches the hut as dusk falls, warm firelight glowing in its doorway
    mood: homecoming
    duration_s: 5

  # --- Inside the hut, night ---
  - id: s07
    character: ismael
    costume: beachwear
    location: thatched_hut
    props: [satchel]
    framing: medium shot, waist up
    position: centre frame beside the worktable
    action: he drops the satchel on the floor and sits down at the worktable
    mood: eager
    duration_s: 5

  - id: s08
    character: ismael
    costume: beachwear
    location: thatched_hut
    props: [crystal]
    framing: close-up of his face and the crystal
    camera: { lens: 85mm }
    position: face left of centre, the crystal held up on the right
    action: he holds the crystal up to the firelight and turns it slowly, smiling
    mood: delight
    duration_s: 5

  - id: s09
    character: ismael
    costume: beachwear
    location: thatched_hut
    props: [necklace]
    framing: close-up of the worktable, his hands entering the frame
    camera: { angle: slightly above, lens: 50mm }
    position: the necklace in the centre of the table
    action: he lifts a cloth to reveal the necklace, its four-claw setting empty
    mood: anticipation
    duration_s: 5

  - id: s10
    character: ismael
    costume: beachwear
    location: thatched_hut
    props: [crystal, necklace]
    framing: extreme close-up of his hands, the necklace and the crystal
    camera: { angle: slightly above, lens: 100mm macro }
    position: hands in the centre of the frame
    action: his fingers press the crystal into the empty setting and fold the copper claws over it
    mood: careful, precise
    duration_s: 5

  - id: s11
    character: ismael
    costume: beachwear
    location: thatched_hut
    props: [necklace, crystal]
    framing: medium wide shot of the hammock and the fire
    position: lying in the hammock, right of frame, the fire in the foreground on the left
    action: he rests in the hammock holding the finished necklace, the green crystal now set in its claws, his eyes closing
    mood: peaceful, complete
    duration_s: 5
