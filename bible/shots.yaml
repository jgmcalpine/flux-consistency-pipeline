# The shot list. Every shot references the bible by id; prompts are built from it.

# Applies to every shot. One look for the whole film = one place to change it.
style: cinematic 35mm film still, anamorphic, natural film grain, muted colour grade

# Every shot starts from these; a shot overrides only what it needs.
camera_defaults:
  angle: eye level
  lens: 35mm
  depth_of_field: shallow, subject sharp, background soft

shots:
  - id: s01
    character: keeper
    costume: beachwear
    location: cliff_path
    framing: wide shot, subject small in the lower third
    camera: { lens: 24mm, depth_of_field: "deep, everything in focus" }
    position: walking along the path, left of centre
    action: he walks toward the thatched hut, leaning into the wind
    mood: determined, peaceful
    duration_s: 5

  - id: s02
    character: keeper
    costume: beachwear
    location: cliff_path
    framing: medium close-up, head and shoulders
    camera: { lens: 85mm }
    position: centre frame, facing the jungle
    action: he stops and looks out over the jungle, squinting
    mood: uneasy
    duration_s: 5

  - id: s03
    character: keeper
    costume: indoor
    location: thatched_hut
    framing: close-up of his face above the fire
    camera: { angle: slightly low, lens: 50mm }
    position: right of frame, the jewelry and tools on the floor filling the left
    action: he polishes a necklace he has been making, his reflection distorted in the large crystal at the center of the necklace
    mood: calm, private
    duration_s: 5
