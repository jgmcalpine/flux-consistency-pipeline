[project]
name = "fluxpipe"
version = "0.1.0"
description = "A consistency pipeline for FLUX: keep characters, costumes and locations on-model across AI-generated shots."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Installed later, in M5-M6. Kept separate because they are large.
qa = [
    "insightface>=0.7",
    "onnxruntime>=1.17",
    "opencv-python>=4.9",
    "numpy>=1.26",
]
dev = ["pytest>=8"]

[project.scripts]
fluxpipe = "fluxpipe.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
